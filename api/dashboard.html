<!doctype html><meta charset="utf-8"><title>FiveM Audit Dashboard</title><style>body{background:#10131a;color:#edf1f7;font:15px system-ui;margin:40px;max-width:980px}input,button{padding:9px;margin:5px 0}table{width:100%;border-collapse:collapse;margin-top:22px}td,th{padding:10px;border-bottom:1px solid #293040;text-align:left}.yes{color:#80e5a3}.no{color:#ffca75}</style><h1>FiveM Audit Dashboard</h1><p>Standalone staff view. The secret stays in your browser and is sent only as an API header.</p><input id="key" type="password" placeholder="Server secret"><button onclick="loadScans()">Load scans</button><br><input id="player" placeholder="Player name / Discord ID"><button onclick="createScan()">Create scan PIN</button><p id="msg"></p><table><thead><tr><th>PIN</th><th>Player</th><th>Created (UTC)</th><th>Report</th></tr></thead><tbody id="rows"></tbody></table><script>const headers=()=>({'Content-Type':'application/json','X-Server-Secret':key.value});async function loadScans(){let r=await fetch('/admin/scans',{headers:headers()}),m=document.querySelector('#msg'),rows=document.querySelector('#rows');if(!r.ok){m.textContent='Access denied or API error.';return}let x=await r.json();rows.innerHTML=x.map(s=>`<tr><td>${s.code}</td><td>${s.player}</td><td>${s.createdAt}</td><td class="${s.received?'yes':'no'}">${s.received?'Received':'Pending'}</td></tr>`).join('');m.textContent=`${x.length} session(s)`}async function createScan(){let r=await fetch('/sessions',{method:'POST',headers:headers(),body:JSON.stringify({player:player.value||'Unassigned'})}),m=document.querySelector('#msg');if(!r.ok){m.textContent='Could not create PIN.';return}let x=await r.json();m.textContent=`New scan PIN: ${x.code}. Give this PIN to the player.`;loadScans()}</script>
